name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate sample Android project
        run: |
          mkdir -p app/src/main/java/com/tanphong/controller
          mkdir -p app/src/main/res/xml
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'TanPhongAIController'
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.tanphong.controller'
            compileSdk 35
            defaultConfig { applicationId 'com.tanphong.controller'; minSdk 29; targetSdk 35; versionCode 1; versionName '0.1-test' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
 <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Tan Phong AI Controller" android:theme="@android:style/Theme.Material.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><service android:name=".ControlService" android:exported="true" android:label="Tan Phong Controller" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/service"/></service></application></manifest>
          EOF
 cat > app/src/main/res/xml/service.xml <<'EOF'
 <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeAllMask" android:accessibilityFeedbackType="feedbackGeneric" android:canRetrieveWindowContent="true" android:description="@android:string/ok" android:notificationTimeout="100" />
          EOF
 cat > app/src/main/java/com/tanphong/controller/MainActivity.java <<'EOF'
          package com.tanphong.controller;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.provider.Settings;
          import android.widget.*;
 public class MainActivity extends Activity {
 @Override public void onCreate(Bundle b) {
              super.onCreate(b);
 LinearLayout l=new LinearLayout(this); l.setPadding(32,60,32,30);l.setOrientation(1);
 TextView t=new TextView(this);t.setText("TAN PHONG AI CONTROLLER - TEST\nBan thu nghiem, chua ket noi ChatGPT hay tu dang Facebook.");t.setTextSize(20);l.addView(t);
 Button a=new Button(this);a.setText("1. MO QUYEN TRO NANG");a.setOnClickListener(v->startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));l.addView(a);
 Button on=new Button(this);on.setText("2. BAT DIEU KHIEN");on.setOnClickListener(v->{if(ControlService.instance!=null)ControlService.instance.setActive(true);else Toast.makeText(this,"Bat Tro nang truoc",1).show();});l.addView(on);
 Button off=new Button(this);off.setText("DUNG KHAN CAP");off.setOnClickListener(v->{if(ControlService.instance!=null)ControlService.instance.setActive(false);});l.addView(off);
              setContentView(l);
            }
          }
          EOF
 cat > app/src/main/java/com/tanphong/controller/ControlService.java <<'EOF'
          package com.tanphong.controller;
          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.WindowManager;
          import android.view.Gravity;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.content.Context;
          import android.widget.TextView;
 public class ControlService extends AccessibilityService {
 
             static ControlService instance;
             private boolean active=false;
             private TextView toggle;
             private WindowManager manager;
 public void setActive(boolean x){active=x;if(toggle!=null){toggle.setText(x?"DUNG AI":"BAT AI");toggle.setBackgroundColor(x?Color.RED:Color.rgb(0,128,64));}}
 @Override protected void onServiceConnected(){instance=this;manager=(WindowManager)getSystemService(Context.WINDOW_SERVICE);toggle=new TextView(this);toggle.setTextSize(18);toggle.setTextColor(Color.WHITE);toggle.setPadding(20,20,20,20);WindowManager.LayoutParams p=new WindowManager.LayoutParams(-2,-2,WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,PixelFormat.TRANSLUCENT);p.gravity=Gravity.RIGHT|Gravity.CENTER_VERTICAL;manager.addView(toggle,p);toggle.setOnClickListener(v->setActive(!active));setActive(false);}
 @Override public void onAccessibilityEvent(AccessibilityEvent e){}
 @Override public void onInterrupt(){setActive(false);}
 @Override public void onDestroy(){setActive(false);if(toggle!=null)manager.removeView(toggle);instance=null;super.onDestroy();}
          }
          EOF
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TanPhongAIController-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
